<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងបញ្ជីខ្មៅបុគ្គលិក</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f0f2f5; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .nav-button.active svg, .nav-button.active span { color: #2563eb; font-weight: 600; }
        .dropdown-item:hover { background-color: #f1f5f9; }
        .modal-backdrop { background-color: rgba(0,0,0,0.5); }
        .refresh-btn.loading svg { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-100 pb-24">

    <div class="w-full max-w-2xl mx-auto bg-white rounded-b-2xl shadow-lg">
        <div class="text-center p-6 bg-blue-600 text-white rounded-t-2xl">
            <h1 class="text-2xl md:text-3xl font-bold">បញ្ជីខ្មៅបុគ្គលិក</h1>
            <p class="opacity-80 mt-1">Employee Blacklist Management</p>
        </div>

        <div class="p-4 md:p-6">
            <div id="loader" class="flex flex-col items-center justify-center space-y-3 p-8"><div class="loader"></div><p class="text-slate-600">កំពុងទាញទិន្នន័យ...</p></div>

            <!-- VIEW 1: Add to Blacklist -->
            <div id="add-view" class="hidden">
                <form id="main-form" class="space-y-6">
                    <div class="relative">
                        <label for="employee-search" class="block text-sm font-medium text-slate-700 mb-1">ស្វែងរកបុគ្គលិក</label>
                        <input autocomplete="off" id="employee-search" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="វាយឈ្មោះ ឬអត្តលេខ...">
                        <div id="custom-dropdown" class="hidden absolute z-10 w-full bg-white border rounded-lg mt-1 shadow-lg max-h-60 overflow-y-auto"></div>
                    </div>
                    <div id="employee-info" class="hidden bg-slate-50 p-4 rounded-xl border space-y-4">
                        <div class="flex items-center gap-4">
                            <img id="employee-photo" src="https://placehold.co/100x100/e2e8f0/64748b?text=រូបថត" alt="រូបថត" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow">
                            <div>
                                <h2 id="employee-name" class="text-lg font-bold text-slate-800"></h2>
                                <p id="employee-id" class="text-sm text-slate-500"></p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-x-6 gap-y-2 pt-3 border-t text-sm">
                            <div><strong class="text-slate-600">ភេទ:</strong> <span id="employee-gender"></span></div>
                            <div><strong class="text-slate-600">ក្រុម:</strong> <span id="employee-group"></span></div>
                            <div><strong class="text-slate-600">ថ្នាក់:</strong> <span id="employee-class"></span></div>
                            <div><strong class="text-slate-600">ផ្នែក:</strong> <span id="employee-department"></span></div>
                        </div>
                    </div>
                    <div>
                        <label for="problem-description" class="block text-sm font-medium text-slate-700 mb-1">បញ្ហា / មូលហេតុ</label>
                        <textarea id="problem-description" rows="4" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="សរសេរមូលហេតុ..."></textarea>
                    </div>
                    <button id="submit-button" type="submit" disabled class="w-full bg-red-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300 disabled:bg-slate-300 transition">បន្ថែមទៅក្នុងបញ្ជីខ្មៅ</button>
                </form>
            </div>

            <!-- VIEW 2: Search Blacklist -->
            <div id="list-view" class="hidden space-y-4">
                <div id="filter-bar" class="p-3 bg-slate-50 rounded-lg border space-y-3">
                    <div class="flex gap-2 items-center">
                        <input type="search" id="blacklist-search" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ស្វែងរកតាមឈ្មោះ ឬអត្តលេខ...">
                        <button id="refresh-btn" class="refresh-btn p-2 border rounded-lg bg-white hover:bg-slate-100 text-slate-600 flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5m7 7v-5h-5m-1-1a8 8 0 1116 0H4"></path></svg>
                        </button>
                    </div>
                    <div class="flex gap-2 text-sm items-center">
                        <span class="text-slate-600 font-medium flex-shrink-0">តម្រៀបតាម:</span>
                        <select id="year-filter" class="w-full p-2 border rounded-lg bg-white"><option value="">គ្រប់ឆ្នាំ</option></select>
                        <select id="month-filter" class="w-full p-2 border rounded-lg bg-white"><option value="">គ្រប់ខែ</option></select>
                    </div>
                </div>
                <div id="blacklist-results" class="space-y-3 max-h-[55vh] overflow-y-auto pr-1"></div>
            </div>
            <div id="message-box" class="hidden p-4 mt-4 rounded-lg text-center font-medium"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 space-y-4">
            <h3 class="text-lg font-bold">កែប្រែមូលហេតុ</h3>
            <textarea id="edit-problem-textarea" rows="5" class="w-full p-2 border rounded-lg"></textarea>
            <div class="flex justify-end gap-3">
                <button id="cancel-edit-btn" class="px-4 py-2 bg-slate-200 rounded-lg">បោះបង់</button>
                <button id="save-edit-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg">រក្សាទុក</button>
            </div>
        </div>
    </div>
     <div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 space-y-4 text-center">
            <h3 class="text-lg font-bold">បញ្ជាក់ការលុប</h3>
            <p>តើអ្នកពិតជាចង់លុបបុគ្គលិកនេះចេញពីបញ្ជីខ្មៅមែនទេ?</p>
            <div class="flex justify-center gap-3">
                <button id="cancel-delete-btn" class="px-4 py-2 bg-slate-200 rounded-lg">ទេ, បោះបង់</button>
                <button id="confirm-delete-btn" class="px-4 py-2 bg-red-600 text-white rounded-lg">បាទ/ចាស, លុប</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.05)] flex justify-around p-2">
        <button id="nav-add" class="nav-button flex flex-col items-center text-slate-600 text-sm w-full py-1">
             <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <span>បន្ថែមថ្មី</span>
        </button>
        <button id="nav-list" class="nav-button active flex flex-col items-center text-slate-600 text-sm w-full py-1">
            <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
            <span>បញ្ជីឈ្មោះ</span>
        </button>
    </nav>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- CONFIGURATION ---
        const SOURCE_SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const SOURCE_SHEET_NAME = 'DIList';
        const SOURCE_RANGE = 'A9:AA';
        const BLACKLIST_SHEET_ID = '1uqsiKu0SHOg_8MAHA1m-6ott9pjeom6qTxAv4HNS2To';
        const BLACKLIST_SHEET_NAME = 'Sheet1';
        const DESTINATION_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbznRbFJkPtAr6jivMeZTv3t_jC_3zRBfmOs-8hmlHGdsjUhpmko9DFm-DPMVe0Q4wqY/exec';

        // --- UI ELEMENTS ---
        const loader = document.getElementById('loader');
        const messageBox = document.getElementById('message-box');
        const addView = document.getElementById('add-view');
        const listView = document.getElementById('list-view');
        const mainForm = document.getElementById('main-form');
        const searchInput = document.getElementById('employee-search');
        const customDropdown = document.getElementById('custom-dropdown');
        const employeeInfo = document.getElementById('employee-info');
        const problemTextarea = document.getElementById('problem-description');
        const submitButton = document.getElementById('submit-button');
        const blacklistSearchInput = document.getElementById('blacklist-search');
        const blacklistResultsContainer = document.getElementById('blacklist-results');
        const refreshBtn = document.getElementById('refresh-btn');
        const yearFilter = document.getElementById('year-filter');
        const monthFilter = document.getElementById('month-filter');
        const editModal = document.getElementById('edit-modal');
        const deleteModal = document.getElementById('delete-modal');
        const navAddBtn = document.getElementById('nav-add');
        const navListBtn = document.getElementById('nav-list');

        let employees = [], blacklistEmployees = [], selectedEmployee = null, entryToModify = null;

        // --- API & DATA FUNCTIONS ---
        async function fetchDataFromSheet(sheetId, sheetName, range) {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}${range ? '&range=' + range : ''}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok.');
                const text = await response.text();
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/s)[1];
                return JSON.parse(jsonString);
            } catch (error) {
                console.error(`Error fetching from ${sheetName}:`, error);
                throw error;
            }
        }

        async function postDataToScript(payload) {
            try {
                const response = await fetch(DESTINATION_APPS_SCRIPT_URL, {
                    method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'application/json' },
                });
                return await response.json();
            } catch (error) {
                return { status: 'error', message: 'Network error occurred.' };
            }
        }

        async function loadSourceEmployees() {
            try {
                const data = await fetchDataFromSheet(SOURCE_SHEET_ID, SOURCE_SHEET_NAME, SOURCE_RANGE);
                employees = data.table.rows.map(row => {
                    const getCell = (index) => (row.c && row.c[index] ? row.c[index].v : '');
                    return { id: getCell(4), group: getCell(6), name: getCell(11), gender: getCell(13), class: getCell(17), department: getCell(18), photo: getCell(26) };
                }).filter(emp => emp.id && emp.name);
            } catch (error) { showMessage('មិនអាចទាញទិន្នន័យបុគ្គលិកបានទេ!', false); }
        }

        async function loadBlacklist(showRefreshMessage = false) {
            if (showRefreshMessage) refreshBtn.classList.add('loading');
            try {
                const data = await fetchDataFromSheet(BLACKLIST_SHEET_ID, BLACKLIST_SHEET_NAME);
                if (!data.table.rows || data.table.rows.length <= 1) {
                    blacklistEmployees = [];
                } else {
                    blacklistEmployees = data.table.rows.slice(1).map(row => {
                        const getCell = (index, isDate = false) => {
                            if (!row.c || !row.c[index]) return null;
                            const cell = row.c[index];
                            if (isDate && cell.v && typeof cell.v === 'string' && cell.v.startsWith('Date(')) {
                                const parts = cell.v.match(/\d+/g);
                                return parts ? new Date(parts[0], parts[1], parts[2], parts[3] || 0, parts[4] || 0, parts[5] || 0).toISOString() : cell.v;
                            }
                            return cell.v;
                        };
                        return { timestamp: getCell(0, true), id: getCell(1), name: getCell(2), problem: getCell(7), photo: getCell(8) };
                    }).filter(e => e.timestamp);
                }
                populateFilters();
                applyFilters();
            } catch (error) {
                console.error("Error loading blacklist:", error);
                showMessage('មិនអាចទាញបញ្ជីខ្មៅបានទេ!', false);
            } finally {
                if(showRefreshMessage) refreshBtn.classList.remove('loading');
            }
        }

        // --- UI & RENDERING ---
        function renderCustomDropdown(filteredList) {
            customDropdown.innerHTML = '';
            if (filteredList.length === 0) {
                customDropdown.innerHTML = `<div class="p-3 text-sm text-center text-slate-500">រកមិនឃើញលទ្ធផលទេ។</div>`;
            } else {
                filteredList.forEach(emp => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-3 p-2 cursor-pointer dropdown-item';
                    item.innerHTML = `<img src="${emp.photo || 'https://placehold.co/80x80/e2e8f0/64748b?text=??'}" class="w-10 h-10 rounded-full object-cover"><div class="truncate"><p class="font-medium text-sm text-slate-800">${emp.name}</p><p class="text-xs text-slate-500">${emp.id}</p></div>`;
                    item.addEventListener('click', () => {
                        searchInput.value = `${emp.name} - ${emp.id}`;
                        selectedEmployee = emp; displayEmployeeInfo(emp); customDropdown.classList.add('hidden'); updateButtonState();
                    });
                    customDropdown.appendChild(item);
                });
            }
            customDropdown.classList.remove('hidden');
        }

        function renderBlacklist(dataToRender) {
            blacklistResultsContainer.innerHTML = '';
            if (dataToRender.length === 0) {
                blacklistResultsContainer.innerHTML = `<p class="text-center text-slate-500 p-8">មិនមានទិន្នន័យទេ។</p>`; return;
            }
            dataToRender.forEach(emp => {
                const card = document.createElement('div');
                card.className = 'flex items-start gap-3 p-3 bg-white rounded-lg border shadow-sm';
                card.innerHTML = `
                    <img src="${emp.photo || 'https://placehold.co/80x80/e2e8f0/64748b?text=រូបថត'}" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow">
                    <div class="flex-1">
                        <p class="font-semibold text-slate-800">${emp.name}</p>
                        <p class="text-xs text-slate-500">ID: ${emp.id}</p>
                        <p class="text-sm mt-1 text-red-700 bg-red-50 p-2 rounded">${emp.problem || 'គ្មានមូលហេតុ'}</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button class="edit-btn p-1 text-blue-500 hover:bg-blue-100 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.732 3.732z"></path></svg></button>
                        <button class="delete-btn p-1 text-red-500 hover:bg-red-100 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>`;
                card.querySelector('.edit-btn').addEventListener('click', () => openEditModal(emp));
                card.querySelector('.delete-btn').addEventListener('click', () => openDeleteModal(emp));
                blacklistResultsContainer.appendChild(card);
            });
        }
        
        function populateFilters() {
            const years = [...new Set(blacklistEmployees.map(e => new Date(e.timestamp).getFullYear()))].sort((a, b) => b - a);
            yearFilter.innerHTML = '<option value="">គ្រប់ឆ្នាំ</option>';
            years.forEach(year => yearFilter.innerHTML += `<option value="${year}">${year}</option>`);
            monthFilter.innerHTML = '<option value="">គ្រប់ខែ</option>';
            [...Array(12).keys()].forEach(i => monthFilter.innerHTML += `<option value="${i+1}">ខែ ${i+1}</option>`);
        }
        
        function applyFilters() {
            const searchTerm = blacklistSearchInput.value.toLowerCase(), selectedYear = yearFilter.value, selectedMonth = monthFilter.value;
            let filtered = blacklistEmployees;
            if (selectedYear) filtered = filtered.filter(e => new Date(e.timestamp).getFullYear() == selectedYear);
            if (selectedMonth) filtered = filtered.filter(e => new Date(e.timestamp).getMonth() + 1 == selectedMonth);
            if (searchTerm) filtered = filtered.filter(e => e.name.toLowerCase().includes(searchTerm) || (e.id && String(e.id).toLowerCase().includes(searchTerm)));
            renderBlacklist(filtered);
        }

        function switchView(view) {
            addView.classList.toggle('hidden', view !== 'add');
            listView.classList.toggle('hidden', view !== 'list');
            navAddBtn.classList.toggle('active', view === 'add');
            navListBtn.classList.toggle('active', view === 'list');
            if (view === 'list') {
               loadBlacklist(true);
            }
        }

        function displayEmployeeInfo(emp) {
            document.getElementById('employee-photo').src = emp.photo || 'https://placehold.co/100x100/e2e8f0/64748b?text=រូបថត';
            document.getElementById('employee-name').textContent = emp.name || 'N/A';
            document.getElementById('employee-id').textContent = `អត្តលេខ: ${emp.id || 'N/A'}`;
            ['gender', 'group', 'class', 'department'].forEach(key => {
                document.getElementById(`employee-${key}`).textContent = emp[key] || 'N/A';
            });
            employeeInfo.classList.remove('hidden');
        }
        
        function updateButtonState() { submitButton.disabled = !(problemTextarea.value.trim().length > 0 && selectedEmployee); }
        function showMessage(msg, isSuccess = true) {
            messageBox.textContent = msg;
            messageBox.className = `p-4 mt-4 rounded-lg text-center font-medium ${isSuccess ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => { messageBox.classList.add('hidden'); }, 4000);
        }
        function openEditModal(emp) { entryToModify = emp; document.getElementById('edit-problem-textarea').value = emp.problem; editModal.classList.remove('hidden'); }
        function openDeleteModal(emp) { entryToModify = emp; deleteModal.classList.remove('hidden'); }
        
        // --- EVENT HANDLERS ---
        async function handleAddSubmit(event) {
            event.preventDefault();
            if (submitButton.disabled) return;

            // --- DUPLICATE CHECK ---
            if (blacklistEmployees.some(entry => entry.id === selectedEmployee.id)) {
                showMessage('បុគ្គលិកនេះមានក្នុងបញ្ជីខ្មៅរួចហើយ!', false);
                return;
            }

            submitButton.disabled = true; submitButton.textContent = 'កំពុងបញ្ជូន...';
            const newEntry = { action: 'add', ...selectedEmployee, problem: problemTextarea.value.trim(), timestamp: new Date().toISOString() };
            const result = await postDataToScript(newEntry);
            
            showMessage(result.status === 'success' ? 'បានបន្ថែមដោយជោគជ័យ!' : 'ការបញ្ជូនមានបញ្ហា!', result.status === 'success');
            
            if (result.status === 'success') {
                // Add to local list to avoid re-fetching
                blacklistEmployees.push(newEntry);
                mainForm.reset(); 
                selectedEmployee = null; 
                employeeInfo.classList.add('hidden');
            }
            submitButton.disabled = false; submitButton.textContent = 'បន្ថែមទៅក្នុងបញ្ជីខ្មៅ'; 
            updateButtonState();
        }

        async function handleSaveEdit() {
            const newProblem = document.getElementById('edit-problem-textarea').value;
            const result = await postDataToScript({ action: 'edit', timestamp: entryToModify.timestamp, problem: newProblem });
            showMessage(result.status === 'success' ? 'កែប្រែបានជោគជ័យ!' : 'ការកែប្រែមានបញ្ហា!', result.status === 'success');
            if (result.status === 'success') {
                // Update local list
                const index = blacklistEmployees.findIndex(e => e.timestamp === entryToModify.timestamp);
                if (index !== -1) blacklistEmployees[index].problem = newProblem;
                applyFilters();
            }
            editModal.classList.add('hidden');
        }

        async function handleDeleteConfirm() {
            const result = await postDataToScript({ action: 'delete', timestamp: entryToModify.timestamp });
            showMessage(result.status === 'success' ? 'បានលុបចេញដោយជោគជ័យ!' : 'ការលុបមានបញ្ហា!', result.status === 'success');
            if (result.status === 'success') {
                // Remove from local list
                blacklistEmployees = blacklistEmployees.filter(e => e.timestamp !== entryToModify.timestamp);
                applyFilters();
            }
            deleteModal.classList.add('hidden');
        }
        
        // --- EVENT LISTENERS ---
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            if (!searchTerm) { customDropdown.classList.add('hidden'); return; }
            renderCustomDropdown(employees.filter(emp => emp.name.toLowerCase().includes(searchTerm) || String(emp.id).toLowerCase().includes(searchTerm)));
        });
        document.addEventListener('click', (e) => { if (!e.target.closest('.relative')) customDropdown.classList.add('hidden'); });
        mainForm.addEventListener('submit', handleAddSubmit);
        problemTextarea.addEventListener('input', updateButtonState);
        [yearFilter, monthFilter, blacklistSearchInput].forEach(el => el.addEventListener('input', applyFilters));
        refreshBtn.addEventListener('click', () => { showMessage('កំពុងធ្វើបច្ចុប្បន្នភាព...'); loadBlacklist(true); });
        navAddBtn.addEventListener('click', () => switchView('add'));
        navListBtn.addEventListener('click', () => switchView('list'));
        document.getElementById('save-edit-btn').addEventListener('click', handleSaveEdit);
        document.getElementById('cancel-edit-btn').addEventListener('click', () => editModal.classList.add('hidden'));
        document.getElementById('confirm-delete-btn').addEventListener('click', handleDeleteConfirm);
        document.getElementById('cancel-delete-btn').addEventListener('click', () => deleteModal.classList.add('hidden'));
        
        // --- INITIALIZATION ---
        async function initialize() {
            // Load both lists at the start for better performance and duplicate checking.
            await Promise.all([
                loadSourceEmployees(),
                loadBlacklist() 
            ]);
            loader.classList.add('hidden');
            switchView('add');
        }
        initialize();
    });
    </script>
</body>
</html>
